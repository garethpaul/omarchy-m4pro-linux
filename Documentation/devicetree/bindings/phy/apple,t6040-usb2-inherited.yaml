%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/apple,t6040-usb2-inherited.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: J614s/J616s inherited USB2 device PHY for RAM experiments

maintainers:
  - Sven Peter <sven@kernel.org>

description: |
  Admission for the USB2 device-mode state prepared by m1n1 on J614s USB1
  or J616s USB0.
  The J614s profile additionally requires the exact USB1 PHY/PIPE apertures.
  The provider reads its USB2/PIPE state and performs no power, reset or
  calibration writes. Its caller owns controller/DART handoff and must retain
  the bootloader's PHY clocks and physical watchdog until cold recovery.

  J616s USB0 references SID 0 at DART 0x382f00000 and SID 1 at
  DART 0x382f80000, sharing fault interrupt 1623. J614s USB1 references
  SID 0 at DART 0x38af00000 and SID 1 at DART 0x38af80000, sharing fault
  interrupt 1655. Each pair uses the same DMA aperture. The native handoff uses the low 32-bit
  aperture, from zero through 0xffffffff, for both providers. The caller must
  transfer both banks before either ordinary DART driver probe; an idle state
  snapshot does not establish exclusive ownership.

  On J614s USB1, generic serial bulk transfers were observed with both
  snps,dis_u2_susphy_quirk and snps,dis_enblslpm_quirk on the consumer.
  These properties retain the working bootloader USB2 low-power settings.
  Their individual necessity was not isolated.

  Notification-suppressed USB2 bulk device operation has been observed with
  this two-bank model. Normal ACM notifications remain unqualified, and this
  does not describe complete T6040 Type-C, host or SuperSpeed support.

properties:
  compatible:
    const: apple,t6040-usb2-inherited

  reg:
    minItems: 2
    maxItems: 2

  reg-names:
    items:
      - const: usb2phy
      - const: pipehandler

  '#phy-cells':
    const: 0

  apple,inherited-handoff:
    type: boolean
    description: |
      The bootloader has retired its DWC3 consumers, transferred DMA ownership
      of both USB DART banks and retained initialized USB2 PHY clocks and a
      physical watchdog. This assertion does not perform those operations.

required:
  - compatible
  - reg
  - reg-names
  - '#phy-cells'
  - apple,inherited-handoff

additionalProperties: false
